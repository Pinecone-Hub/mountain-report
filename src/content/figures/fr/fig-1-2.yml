title: Bilan de masse spécifique cumulé dans quatre régions glaciaires, de 1976 à 2025
caption: Bilan de masse spécifique cumulé, en mètres d'équivalent en eau (m éq.
  eau), pour l'Europe centrale, l'Asie centrale, l'Asie du Sud (ouest) et l'Asie
  du Sud (est), calculé pour le présent rapport en additionnant les valeurs
  régionales annuelles du jeu de données du WGMS depuis 1976 jusqu'à chaque
  année hydrologique. Aucune incertitude n'est indiquée, car le jeu de données
  fournit des incertitudes pour les valeurs annuelles, mais pas pour les séries
  régionales cumulées. Ces valeurs du WGMS diffèrent des valeurs de GlaMBIE pour
  l'Europe centrale et des moyennes régionales du SROCC citées dans le texte du
  chapitre, qui reposent sur d'autres méthodes et d'autres périodes.
alt: Graphique linéaire du bilan de masse spécifique cumulé dans quatre régions
  glaciaires de 1976 à 2025, en baisse dans les quatre régions, l'Europe
  centrale ayant la valeur la plus basse en 2025.
longDescription: L'axe horizontal présente les années hydrologiques 1976 à 2025
  (hémisphère Nord, débutant le 1er octobre). L'axe vertical présente le bilan
  de masse spécifique cumulé en mètres d'équivalent en eau (m éq. eau),
  c'est-à-dire la variation de masse répartie uniformément sur la superficie du
  glacier sous forme d'une épaisseur d'eau. Exprimées par unité de surface, ces
  valeurs permettent de comparer l'amincissement entre des régions de tailles
  très différentes et ne constituent pas des totaux de masse. L'Europe centrale
  part de −0,34 m éq. eau en 1976 et passe au-dessus de zéro en 1985 (+2,47)
  après des gains à la fin des années 1970 et au début des années 1980. Elle
  descend ensuite à −1,79 en 1995, −4,21 en 2000, −7,76 en 2005, −16,30 en 2015
  et −29,18 en 2025, tandis que sa superficie glaciaire diminue de 2 692,3 km² à
  1 703,3 km². Pour 1985, 2000, 2015 et 2025, les valeurs sont de −5,10 ; −11,44
  ; −18,10 et −25,26 pour l'Asie du Sud (est), de −2,52 ; −4,44 ; −7,16 et
  −11,54 pour l'Asie centrale, et de −2,43 ; −3,65 ; −6,07 et −9,53 pour l'Asie
  du Sud (ouest).
