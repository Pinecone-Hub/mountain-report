title: Cumulative specific mass change in four glacier regions, 1976 to 2025
caption: Cumulative specific mass change in metres water equivalent (m w.e.) for
  Central Europe, Central Asia, South Asia West and South Asia East, computed
  for this report by summing the annual regional values in the WGMS dataset from
  1976 to each hydrological year. No uncertainty is shown, because the dataset
  gives uncertainties for the annual values but not for the cumulative regional
  series. These WGMS values differ from the GlaMBIE values for Central Europe
  and the SROCC regional averages given in the chapter text, which use other
  methods and periods.
alt: Line chart of cumulative specific mass change in four glacier regions from
  1976 to 2025, with all four falling and Central Europe lowest by 2025.
longDescription: The horizontal axis shows hydrological years 1976 to 2025
  (Northern Hemisphere, starting on 1 October). The vertical axis shows
  cumulative specific mass change in metres water equivalent (m w.e.), the mass
  change spread evenly over the glacier area as a thickness of water. As values
  per unit area, they compare thinning between regions of very different size
  and are not mass totals. Central Europe starts at −0.34 m w.e. in 1976 and is
  above zero in 1985 (+2.47) after gains in the late 1970s and early 1980s. It
  then falls to −1.79 in 1995, −4.21 in 2000, −7.76 in 2005, −16.30 in 2015 and
  −29.18 in 2025, while its glacier area shrinks from 2,692.3 km² to 1,703.3
  km². For 1985, 2000, 2015 and 2025 the values are −5.10, −11.44, −18.10 and
  −25.26 for South Asia East, −2.52, −4.44, −7.16 and −11.54 for Central Asia,
  and −2.43, −3.65, −6.07 and −9.53 for South Asia West.
